name: student-management ci-cd

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Stage
        run: |
          mvn clean package
          echo "Checking MySQL JDBC driver in WAR..."
          jar tf target/*.war | grep mysql

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Push Artifacts to S3
        run: aws s3 cp target/*.war s3://krushna.online123123/Artifacts/student.war

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.host.url="$SONAR_HOST_URL"

      - name: SonarQube Quality Gates
        run: |
          STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=com.school:student-management" \
            | jq -r '.projectStatus.status')
          echo "Quality Gate: $STATUS"
          [ "$STATUS" = "OK" ] || exit 1

      - name: Docker Build 
        run: |
          docker build -t student .
          docker images

      - name: Trivy Install 
        run: |
          sudo apt-get update
          sudo apt-get install -y wget 
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Image Using Trivy
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 student:latest

      - name: Push Image to ECR 
        run: |
          aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 267850879086.dkr.ecr.us-west-2.amazonaws.com
          docker tag student:latest 267850879086.dkr.ecr.us-west-2.amazonaws.com/student:latest
          docker push 267850879086.dkr.ecr.us-west-2.amazonaws.com/student:latest

      - name: Terraform Installation
        uses: hashicorp/setup-terraform@v4
        with:
          Terraform_version: latest

      - name: Terraform init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply 
        run: terraform apply -auto-approve

      - name: kubectl install
        uses: azure/setup-kubectl@v4

      - name: Deployment on Kubernetes
        run: |
          aws eks update-kubeconfig --name krushna-eks-cluster --region us-west-2
          kubectl apply -f k8s/
          sleep 30
          kubectl get pods
          kubectl get svc -o wide











          
